<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WunWun — What are you doing today?</title>
  <meta name="description" content="WunWun desktop sticky notes & micro-tasks. Local-first. Always on top." />
  <style>
    :root {
      --bg: #121212;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --accent: #f1c40f;
      --card: #1e1e1e;
      --grad: linear-gradient(135deg, #ff8a4c, #ff6b2c, #e85d04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 50% at 80% 0%, rgba(241,196,15,0.15), transparent 55%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: #111;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 34px;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    h1 span {
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: var(--muted); line-height: 1.55; margin-bottom: 22px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 14px;
    }
    a.primary { background: var(--accent); color: #111; }
    a.ghost { border: 1px solid #333; color: var(--text); }
    .note { margin-top: 18px; font-size: 12px; color: var(--muted); }
    code { color: #ddd; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">DESKTOP APP</div>
    <h1><span>WunWun</span></h1>
    <p>What are you doing today? — Sticky notes + micro-tasks ที่ลอยบนเดสก์ท็อป Local-first ใช้ได้ offline</p>
    <div class="actions">
      <a class="btn primary"
         href="https://github.com/passawutaplus/wunwun/releases/download/v1.0.0/WunWun.Setup.1.0.0.exe"
         download="WunWun-Setup-1.0.0.exe">ดาวน์โหลด .exe</a>
      <a class="btn ghost" href="https://github.com/passawutaplus/wunwun">GitHub</a>
    </div>
    <p class="note">กดปุ่มแล้วไฟล์ติดตั้งจะโหลดลงเครื่องทันที · หรือใช้ <a href="https://github.com/passawutaplus/wunwun/releases/download/v1.0.0/WunWun.1.0.0.exe" download="WunWun-1.0.0-portable.exe" style="color:#ddd">portable</a> (ไม่ต้องติดตั้ง)</p>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Snap</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; background: #000; }
    #shot {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      opacity: 0.55;
      pointer-events: none;
      user-select: none;
    }
    #dim {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
    }
    #sel {
      position: absolute;
      border: 2px solid #f1c40f;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
      display: none;
      pointer-events: none;
    }
    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,20,20,0.85);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font: 12px Segoe UI, sans-serif;
      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="shot" alt="" />
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="hint">ลากเพื่อเลือกพื้นที่ · Esc ยกเลิก</div>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const shot = decodeURIComponent(params.get('shot') || '');
      document.getElementById('shot').src = shot;

      const sel = document.getElementById('sel');
      let start = null;
      let dragging = false;

      function finish(rect) {
        window.stickyAPI.snipDone(rect);
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') finish(null);
      });

      window.addEventListener('mousedown', (e) => {
        dragging = true;
        start = { x: e.clientX, y: e.clientY };
        sel.style.display = 'block';
        sel.style.left = start.x + 'px';
        sel.style.top = start.y + 'px';
        sel.style.width = '0px';
        sel.style.height = '0px';
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragging || !start) return;
        const x = Math.min(start.x, e.clientX);
        const y = Math.min(start.y, e.clientY);
        const w = Math.abs(e.clientX - start.x);
        const h = Math.abs(e.clientY - start.y);
        sel.style.left = x + 'px';
        sel.style.top = y + 'px';
        sel.style.width = w + 'px';
        sel.style.height = h + 'px';
      });

      window.addEventListener('mouseup', (e) => {
        if (!dragging || !start) return;
        dragging = false;
        const x = Math.min(start.x, e.clientX);
        const y = Math.min(start.y, e.clientY);
        const w = Math.abs(e.clientX - start.x);
        const h = Math.abs(e.clientY - start.y);
        finish({ x, y, w, h });
      });
    })();
  </script>
</body>
</html>
